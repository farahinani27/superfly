<!doctype html><meta charset="utf-8"><title>Warranty QR — proof</title>
<style>
  body{font:14px/1.5 -apple-system,Helvetica,Arial;margin:32px;background:#fff;color:#111}
  h1{font-size:18px} h2{font-size:14px;margin:0 0 8px}
  .row{display:flex;gap:40px;flex-wrap:wrap;margin-bottom:28px}
  .card{border:1px solid #ddd;padding:16px;border-radius:6px}

<h1>Warranty QR artwork</h1>

  <div class="card"><object class="big" type="image/svg+xml" data="warranty-AIRSUS330.svg"></object></div>
</div>

<h2>PNG, enlarged (checks the raster output renders)</h2>
<div class="row">
  <div class="card"><img class="big" src="warranty-AIRSUS330.png"></div>
  <div class="card"><img class="big" src="warranty-AIRSUS330.png"></div>
</div>

<h2>Actual print size — 30&nbsp;mm wide</h2>
<div class="row">
  <div class="card"><object class="true" type="image/svg+xml" data="warranty-AIRSUS330.svg"></object>
